# Decap CMS — The Human Bot
# Backend: on Netlify, use Git Gateway + Netlify Identity.
# For local preview without auth: npx decap-server (optional) or use `local_backend: true`.

backend:
  name: git-gateway
  branch: main

# Uncomment for local editing without Netlify Identity:
# local_backend: true

media_folder: public/uploads
public_folder: /uploads

locale: fr

collections:
  - name: settings
    label: Paramètres du site
    files:
      - name: site
        label: Site
        file: src/data/settings.json
        fields:
          - { label: Titre, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: YouTube ID (accueil), name: featuredYoutubeId, widget: string }
          - { label: Titre vidéo (accueil), name: featuredVideoTitle, widget: string }
          - label: Réseaux
            name: social
            widget: object
            fields:
              - { label: Instagram, name: instagram, widget: string }
              - { label: YouTube, name: youtube, widget: string }
              - { label: Stickers (URL), name: stickers, widget: string }

  - name: releases
    label: Sorties / Vidéos
    folder: src/content/releases
    create: true
    slug: '{{slug}}'
    extension: md
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: YouTube ID, name: youtubeId, widget: string, hint: 'ex. r1gGGGSPjS0' }
      - { label: URL YouTube, name: youtubeUrl, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, required: false }
      - { label: Mis en avant, name: featured, widget: boolean, default: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Ordre, name: order, widget: number, default: 0 }
      - { label: Corps, name: body, widget: markdown, required: false }

  - name: links
    label: Liens
    folder: src/content/links
    create: true
    slug: '{{slug}}'
    extension: md
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: URL, name: url, widget: string }
      - { label: Ordre, name: order, widget: number, default: 0 }
      - { label: Note, name: note, widget: text, required: false }
      - { label: Corps, name: body, widget: markdown, required: false }
